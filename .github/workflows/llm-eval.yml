# Answer eval with real model calls: on demand and on pull requests labeled
# llm-eval. Needs the ANTHROPIC_API_KEY repository secret. Costs money, so it
# has a spend cap and isn't run on every push. It reports numbers without
# failing: a threshold has to sit above the run-to-run noise, which hasn't been
# measured yet (design.md D16).
name: llm-eval

on:
  workflow_dispatch:
    inputs:
      split:
        type: choice
        options: [dev, test]
        default: dev
      limit:
        description: Only the first N questions (blank for all)
        default: ""
      spend_cap:
        description: Stop starting new questions after this many dollars
        default: "10"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  answers:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'llm-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      SPLIT: ${{ inputs.split || 'dev' }}
      LIMIT: ${{ inputs.limit }}
      SPEND_CAP: ${{ inputs.spend_cap || '10' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # this action has no floating major tag
        with:
          version: "0.13.3"
          enable-cache: true
      - run: uv sync --locked
      # The index file also caches embeddings by card text, so a restore from an
      # older key still saves work: ingest only embeds cards whose text changed.
      # The cache is saved right after ingest, so a later failing step can't
      # throw away a 36-minute cold build.
      - name: Restore embedding model and index
        id: index-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/fastembed
            data/index.sqlite
          key: index-${{ hashFiles('data/cohort/MANIFEST.sha256', 'src/fhir_rag/fhir/**', 'src/fhir_rag/retrieval/summary.py', 'src/fhir_rag/ingest.py', 'src/fhir_rag/store.py') }}
          restore-keys: index-
      - run: uv run python -m fhir_rag.ingest
      - name: Save embedding model and index
        if: steps.index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/fastembed
            data/index.sqlite
          key: index-${{ hashFiles('data/cohort/MANIFEST.sha256', 'src/fhir_rag/fhir/**', 'src/fhir_rag/retrieval/summary.py', 'src/fhir_rag/ingest.py', 'src/fhir_rag/store.py') }}
      - name: Answer eval
        run: |
          args=(--run "ci-${{ github.run_id }}" --split "$SPLIT" --spend-cap "$SPEND_CAP")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          uv run python -m fhir_rag.evals.run_answers "${args[@]}"
      - name: Report to the job summary
        if: always()
        run: cat evals/reports/answers-ci-*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: answer-eval-${{ github.run_id }}
          path: |
            evals/runs/ci-${{ github.run_id }}/
            evals/reports/answers-ci-${{ github.run_id }}.md
