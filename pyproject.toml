[project]
name = "fhir-rag-evals"
version = "0.1.0"
description = "Question answering over synthetic FHIR R4 records, with cited answers and an evaluation harness"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fhir_rag"

[tool.ruff]
# 100, not the default 88: FHIR field paths, prompts and SQL run long.
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: unused imports, undefined names
    "I",    # import sorting
    "B",    # bugbear: likely bugs, such as mutable default arguments
    "UP",   # pyupgrade: modern syntax for the target Python version
    "SIM",  # simplifications
    "RUF",  # ruff's own checks
]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # so tests can import the cohort builders
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
